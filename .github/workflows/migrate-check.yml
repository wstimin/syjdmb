# 迁移回归检查：每次 push master 都对真实 PostgreSQL 16 跑一遍完整迁移链，
# 并断言防重索引的定义与行为契约（旧写法「enum→text 索引表达式」必须被 PG 拒绝，
# 新写法 NULLS NOT DISTINCT 必须生效）。轻量（约 2 分钟），用作迁移安全的持续防线。
name: migrate-check

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  migrate:
    name: PostgreSQL 16 全量迁移验证
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nodeshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d nodeshop"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 全量迁移（修复后的完整迁移链）
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nodeshop
        run: npx --yes prisma@5 migrate deploy

      - name: 校验防重索引（存在 / NULLS NOT DISTINCT / 部分谓词）
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nodeshop
        run: |
          set -e
          U="$DATABASE_URL"
          # 每条断言用「命中则除 1、未命中则除 0 报错」的普通 SELECT 表达：
          # 不用 DO 块（Prisma CLI 对其有兼容分歧），也不依赖结果回显；断言不成立
          # 时数据库直接报 division by zero，CLI 以非零退出码反映给步骤。
          npx --yes prisma@5 db execute --url "$U" --stdin <<'SQL'
          SELECT 1 / (SELECT count(*) FROM pg_class WHERE relname = 'Order_renewal_dup_key');
          SQL
          npx --yes prisma@5 db execute --url "$U" --stdin <<'SQL'
          SELECT 1 / (SELECT count(*) FROM pg_index i JOIN pg_class c ON c.oid = i.indexrelid
                      WHERE c.relname = 'Order_renewal_dup_key' AND i.indnullsnotdistinct);
          SQL
          npx --yes prisma@5 db execute --url "$U" --stdin <<'SQL'
          SELECT 1 / (SELECT count(*) FROM pg_index i JOIN pg_class c ON c.oid = i.indexrelid
                      WHERE c.relname = 'Order_renewal_dup_key' AND i.indpred IS NOT NULL);
          SQL
          echo "[OK] 防重索引存在且为 NULLS NOT DISTINCT + 部分谓词"

      - name: 行为契约验证（旧写法被拒 / 新写法生效 / 并发防重语义）
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nodeshop
        run: |
          set -e
          U="$DATABASE_URL"
          # 探针表：真实 enum 列 + 与 Order 防重索引同构的关键字
          npx --yes prisma@5 db execute --url "$U" --stdin <<'SQL'
          CREATE TABLE IF NOT EXISTS _probe (
            id serial PRIMARY KEY,
            g int NOT NULL,
            tn "RenewType",
            status text NOT NULL DEFAULT 'PENDING'
          );
          DROP INDEX IF EXISTS _probe_key;
          DROP INDEX IF EXISTS _probe_bad;
          SQL

          # 1) 原始故障写法（enum→text 进索引表达式）必须被 PG 拒绝：42P17 IMMUTABLE
          set +e
          npx --yes prisma@5 db execute --url "$U" --stdin 2>bad.txt <<'SQL'
          CREATE UNIQUE INDEX _probe_bad ON _probe (COALESCE(tn::text, '__NULL__')) WHERE status IN ('PENDING', 'PAID');
          SQL
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "FAIL: 旧写法建索引竟然成功（与生产故障不符）"; exit 1
          fi
          grep -qi "IMMUTABLE" bad.txt \
            && echo "[OK] 旧写法被 PG 拒绝（42P17 IMMUTABLE），与生产故障一致" \
            || { echo "FAIL: 旧写法失败但原因不符："; cat bad.txt; exit 1; }

          # 2) 新写法：纯列 + NULLS NOT DISTINCT + 部分谓词 → 必须成功
          npx --yes prisma@5 db execute --url "$U" --stdin <<'SQL'
          CREATE UNIQUE INDEX _probe_key ON _probe (g, tn) NULLS NOT DISTINCT WHERE status IN ('PENDING', 'PAID');
          SQL
          echo "[OK] 新写法（NULLS NOT DISTINCT）建索引成功"

          # 3) 互不冲突的基线插入（不同组 / 同组 NULL vs EXPIRY 可共存）
          for SQL in \
            "INSERT INTO _probe(g, tn, status) VALUES (7, NULL, 'PENDING')" \
            "INSERT INTO _probe(g, tn, status) VALUES (8, 'EXPIRY', 'PENDING')" \
            "INSERT INTO _probe(g, tn, status) VALUES (7, 'EXPIRY', 'PENDING')"; do
            npx --yes prisma@5 db execute --url "$U" --stdin <<<"$SQL" && echo "[OK] $SQL"
          done

          # 4) 同组同 NULL 类型再插 → 必须撞唯一索引（NULL == NULL）
          set +e
          npx --yes prisma@5 db execute --url "$U" --stdin 2>dup.txt <<'SQL'
          INSERT INTO _probe(g, tn, status) VALUES (7, NULL, 'PENDING');
          SQL
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "FAIL: 重复插入（同组同 NULL）竟然成功"; exit 1
          fi
          grep -qiE "unique|duplicate key|23505" dup.txt \
            && echo "[OK] 重复插入被唯一索引拦截（NULL == NULL）" \
            || { echo "FAIL: 拦截原因不符："; cat dup.txt; exit 1; }

          # 5) 终态不拦：同组已完成/失败后可合法重下单（status=FAILED 不在谓词内）
          npx --yes prisma@5 db execute --url "$U" --stdin <<'SQL'
          INSERT INTO _probe(g, tn, status) VALUES (7, NULL, 'FAILED');
          SQL
          echo "[OK] 终态 FAILED 不拦截（合法重下单不受影响）"

  heal:
    name: 生产脏历史自愈回归（失败/被误标 → 预删残留索引+删记录 → 0001 重放成功）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nodeshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d nodeshop"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 阶段一 先落 0001 之前的真实基线迁移（得到 Order 等表结构）
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nodeshop
        run: |
          set -e
          # 仿真生产：先只跑 0001/0002 之前的迁移，与事故现场的表结构一致
          rm -rf prisma/migrations/20260910000001_add_renewal_dup_unique \
                 prisma/migrations/20260910000002_fix_renewal_dup_key
          npx --yes prisma@5 migrate deploy
          echo "[OK] 基线迁移完成"

      - name: 阶段二 注入旧版故障 0001（enum→text 索引表达式）复现 42P17 失败记录
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nodeshop
        run: |
          set -e
          U="$DATABASE_URL"
          mkdir -p prisma/migrations/20260910000001_add_renewal_dup_unique
          cat > prisma/migrations/20260910000001_add_renewal_dup_unique/migration.sql <<'SQL'
          -- 复刻旧版故障迁移：enum→text 索引表达式，PG 必报 42P17 IMMUTABLE
          CREATE UNIQUE INDEX "Order_renewal_dup_key"
          ON "Order" ("userId", "renewalOfInboundId", COALESCE("renewType"::text, '__NULL__'))
          WHERE "status" IN ('PENDING','PAID','PROCESSING') AND "renewalOfInboundId" IS NOT NULL;
          SQL
          set +e
          npx --yes prisma@5 migrate deploy 2>bad.txt
          RC=$?
          set -e
          [ "$RC" -ne 0 ] || { echo "FAIL: 旧版故障 SQL 竟然部署成功"; exit 1; }
          grep -qi IMMUTABLE bad.txt \
            && echo "[OK] 复现失败：42P17 IMMUTABLE 与生产一致" \
            || { echo "FAIL: 失败原因不符："; cat bad.txt; exit 1; }
          # 失败记录必须存在（finished_at 与 rolled_back_at 皆空）
          npx --yes prisma@5 db execute --url "$U" --stdin <<'SQL'
          SELECT 1 / (SELECT count(*) FROM "_prisma_migrations"
                      WHERE "migration_name"='20260910000001_add_renewal_dup_unique'
                        AND "finished_at" IS NULL AND "rolled_back_at" IS NULL);
          SQL
          echo "[OK] 库内留有失败记录（与生产现场一致）"

      - name: 阶段三 复现被误标的双时间戳记录，验证它会被 deploy 拒绝（观测性）
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nodeshop
        run: |
          set -e
          U="$DATABASE_URL"
          # 恢复真实修复版 0001 + 0002（与服务器新镜像一致）
          git checkout -- prisma/migrations/20260910000001_add_renewal_dup_unique \
                           prisma/migrations/20260910000002_fix_renewal_dup_key
          # 仿真早期手工命令把 finished_at 一并写成 NOW() 的错误恢复
          npx --yes prisma@5 db execute --url "$U" --stdin <<'SQL'
          UPDATE "_prisma_migrations" SET "finished_at"=NOW(), "rolled_back_at"=NOW()
          WHERE "migration_name"='20260910000001_add_renewal_dup_unique';
          SQL
          set +e
          npx --yes prisma@5 migrate deploy >double.txt 2>&1
          RC=$?
          set -e
          echo "DOUBLE_STAMP_DEPLOY_EXIT=$RC"
          sed -n '1,15p' double.txt
          [ "$RC" -eq 0 ] && echo "[INFO] 双时间戳记录被 deploy 接受（旧自愈写法实际上安全）" \
                          || echo "[见闻] 双时间戳记录触发 deploy 拒绝——正是生产上的故障形态"
          # 复位为真失败状态，供阶段四做干净的归一化测试
          npx --yes prisma@5 db execute --url "$U" --stdin <<'SQL'
          UPDATE "_prisma_migrations" SET "finished_at"=NULL, "rolled_back_at"=NULL
          WHERE "migration_name"='20260910000001_add_renewal_dup_unique';
          SQL

      - name: 阶段四 观测：标记为已回滚后 deploy 的表现（信息采集，不判失败）
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nodeshop
        run: |
          set -e
          U="$DATABASE_URL"
          # 从真失败状态出发（阶段三已复位为 both NULL）
          npx --yes prisma@5 db execute --url "$U" --stdin <<'SQL'
          UPDATE "_prisma_migrations" SET "finished_at"=NULL, "rolled_back_at"=COALESCE("rolled_back_at", NOW())
          WHERE "migration_name"='20260910000001_add_renewal_dup_unique'
            AND (( "finished_at" IS NULL AND "rolled_back_at" IS NULL )
              OR ( "finished_at" IS NOT NULL AND "rolled_back_at" IS NOT NULL ));
          SQL
          set +e
          npx --yes prisma@5 migrate deploy > /tmp/heal4.log 2>&1
          RC=$?
          set -e
          echo "NORMALIZE_DEPLOY_RC=$RC"
          tail -30 /tmp/heal4.log | while IFS= read -r l; do echo "::error::$l"; done
          if [ "$RC" -eq 0 ]; then
            echo "::notice::观测：标记已回滚后 deploy 成功（该自愈其实可行）"
          else
            echo "::error::观测：标记已回滚仍失败——阶段三已成功重放建索引，此处重放撞 E42P07「already exists」，证实必须预删残留索引"
          fi
          # 复位为真失败状态 + 清掉阶段三残留索引，供阶段五干净测试
          npx --yes prisma@5 db execute --url "$U" --stdin <<'SQL'
          DROP INDEX IF EXISTS "Order_renewal_dup_key";
          UPDATE "_prisma_migrations" SET "finished_at"=NULL, "rolled_back_at"=NULL
          WHERE "migration_name"='20260910000001_add_renewal_dup_unique';
          SQL
          exit 0

      - name: 阶段五 删坏记录＋预删残留索引后，修复版 0001 重放必须成功且索引落库
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nodeshop
        run: |
          set -e
          U="$DATABASE_URL"
          # 与 deploy.sh 完全相同的自愈：预删可能残留的索引（0001 重放即可安全重建），
          # 再删除失败/被误标记录；真「已应用」（仅 finished_at）绝不删
          npx --yes prisma@5 db execute --url "$U" --stdin <<'SQL'
          DROP INDEX IF EXISTS "Order_renewal_dup_key";
          SQL
          npx --yes prisma@5 db execute --url "$U" --stdin <<'SQL'
          DELETE FROM "_prisma_migrations" WHERE "migration_name"='20260910000001_add_renewal_dup_unique'
          AND NOT ( "finished_at" IS NOT NULL AND "rolled_back_at" IS NULL );
          SQL
          set +e
          npx --yes prisma@5 migrate deploy > /tmp/heal5.log 2>&1
          RC=$?
          set -e
          tail -25 /tmp/heal5.log
          if [ "$RC" -ne 0 ]; then
            echo "::error::删记录+预删索引后 deploy 仍失败（exit=$RC）"; exit 1
          fi
          npx --yes prisma@5 db execute --url "$U" --stdin <<'SQL'
          SELECT 1 / (SELECT count(*) FROM "_prisma_migrations"
                      WHERE "migration_name"='20260910000001_add_renewal_dup_unique'
                        AND "finished_at" IS NOT NULL AND "rolled_back_at" IS NULL);
          SQL
          npx --yes prisma@5 db execute --url "$U" --stdin <<'SQL'
          SELECT 1 / (SELECT count(*) FROM "_prisma_migrations"
                      WHERE "migration_name"='20260910000002_fix_renewal_dup_key'
                        AND "finished_at" IS NOT NULL AND "rolled_back_at" IS NULL);
          SQL
          npx --yes prisma@5 db execute --url "$U" --stdin <<'SQL'
          SELECT 1 / (SELECT count(*) FROM pg_index i JOIN pg_class c ON c.oid = i.indexrelid
                      WHERE c.relname = 'Order_renewal_dup_key' AND i.indnullsnotdistinct);
          SQL
          echo "::notice::[OK] 自愈闭环验证通过：0001 修复版重放 + 0002 幂等 + NULLS NOT DISTINCT 索引落库"

      - name: 上传诊断日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heal-diagnostics
          path: /tmp/heal*.log
          if-no-files-found: ignore