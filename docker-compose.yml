version: '3.8'

services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: nodeshop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nodeshop
      POSTGRES_USER: nodeadmin
      POSTGRES_PASSWORD: ${DB_PASS:-nodepassword}
    ports:
      - "127.0.0.1:5432:5432"   # 仅绑定本机回环，避免数据库暴露公网
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodeadmin -d nodeshop"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nodeshop

  # ==========================================
  # Redis
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: nodeshop-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"   # 仅绑定本机回环，避免 Redis 暴露公网
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nodeshop

  # ==========================================
  # Backend API (NestJS)
  # ==========================================
  backend:
    image: nodeshop-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GIT_HASH: ${GIT_HASH:-unknown}
    container_name: nodeshop-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"   # API 内置：仅本机可直连，公网统一走前端/管理后台的 /api 代理
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nodeshop

  # ==========================================
  # Frontend (User-facing, Next.js)
  # ==========================================
  frontend:
    image: nodeshop-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        GIT_HASH: ${GIT_HASH:-unknown}
    container_name: nodeshop-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BACKEND_INTERNAL_URL=http://backend:3001
    depends_on:
      - backend
    networks:
      - nodeshop

  # ==========================================
  # Admin Dashboard (Next.js)
  # ==========================================
  admin:
    image: nodeshop-admin:latest
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        GIT_HASH: ${GIT_HASH:-unknown}
    container_name: nodeshop-admin
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - BACKEND_INTERNAL_URL=http://backend:3001
    depends_on:
      - backend
    networks:
      - nodeshop

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ==========================================
# Network
# ==========================================
networks:
  nodeshop:
    driver: bridge
